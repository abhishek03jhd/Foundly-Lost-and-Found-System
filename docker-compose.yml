services:
  backend:
    build:
      context: ./backend
    environment:
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:?Set ADMIN_BOOTSTRAP_KEY in your environment}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - foundly_data:/app/data
      - foundly_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FOUNDLY_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  foundly_data:
  foundly_uploads:
