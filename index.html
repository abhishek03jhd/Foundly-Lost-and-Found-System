<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f6" />
    <meta name="description" content="A smarter way to reconnect lost belongings with the people who found them." />
    <title>Foundly — Lost & Found</title>
  </head>
  <body>
    <div id="root">
      <main class="startup-help">
        <div class="startup-mark">F</div>
        <p class="startup-label">FOUNDLY · LOST &amp; FOUND</p>
        <h1>One quick start before we can help.</h1>
        <p>This React app needs Vite to compile and run. It cannot be opened directly with VS Code Live Server.</p>
        <a href="http://127.0.0.1:5173/">Open Foundly</a>
        <div class="startup-command">
          <strong>If the link doesn’t open the app</strong>
          <code>cd frontend</code>
          <code>npm run dev</code>
          <span>Then open the Local URL printed in your terminal.</span>
        </div>
      </main>
    </div>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f8f9f6; color: #232920; font-family: "DM Sans", "Segoe UI", sans-serif; }
      .startup-help { width: min(100%, 440px); }
      .startup-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px 13px 13px 5px; background: #426746; color: white; font-family: Georgia, serif; font-size: 22px; }
      .startup-label { margin: 27px 0 11px; color: #858b81; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
      .startup-help h1 { margin: 0 0 12px; font-family: Georgia, serif; font-size: clamp(32px, 8vw, 43px); font-weight: 400; letter-spacing: -1.5px; line-height: 1.08; }
      .startup-help p:not(.startup-label) { color: #747b71; font-size: 14px; line-height: 1.7; }
      .startup-help > a { display: inline-block; margin-top: 10px; padding: 13px 18px; border-radius: 4px; background: #426746; color: white; font-size: 13px; font-weight: 600; text-decoration: none; }
      .startup-command { display: grid; gap: 8px; margin-top: 28px; padding: 17px; border: 1px solid #e6e9e2; background: white; font-size: 12px; }
      .startup-command code { color: #426746; }
      .startup-command span { color: #858b81; font-size: 11px; }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
